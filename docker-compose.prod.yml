version: '3.8'

services:
  # --- REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost:/var/www/html
    depends_on:
      - frontend
      - api-gateway
    networks:
      - be
    restart: always

  # --- FRONTEND ---
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://hotuanphuoc.id.vn/api
        - VITE_GOOGLE_CLIENT_ID=911905736347-gkm7hqptftcjo82ln6j31eh5qnf52q7o.apps.googleusercontent.com
    restart: always
    networks:
      - be

  # --- API GATEWAY ---
  api-gateway:
    build: ./be
    restart: always
    depends_on:
      - auth-service
      - job-service
      - cv-service
      - ai-search-service
    volumes:
      - uploads:/uploads
    networks:
      - be

  # --- SERVICES ---
  auth-service:
    build:
      context: ./be/src/services/auth-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./be/src/services/auth-service/.env
    environment:
      NODE_OPTIONS: "--no-deprecation"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - be

  job-service:
    build:
      context: ./be/src/services/job-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./be/src/services/job-service/.env
    environment:
      NODE_OPTIONS: "--no-deprecation"
      REDIS_URL: redis://redis:6379
      CACHE_PREFIX: webthuctap
      FORECAST_SERVICE_URL: http://forecast-service:8099
    depends_on:
      postgres-job:
        condition: service_healthy
      forecast-service:
        condition: service_started
    volumes:
      - ./data-crawl/donviTDMU_phan_cap.json:/app/data/donviTDMU_phan_cap.json
    networks:
      - be

  cv-service:
    build:
      context: ./be/src/services/cv-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./be/src/services/cv-service/.env
    environment:
      NODE_OPTIONS: "--no-deprecation"
      REDIS_URL: redis://redis:6379
      CACHE_PREFIX: webthuctap
      FASTAPI_LLM_URL: http://llm-service:8000
    depends_on:
      postgres-cv:
        condition: service_healthy
      llm-service:
        condition: service_started
    volumes:
      - uploads:/uploads
    networks:
      - be

  ai-search-service:
    build:
      context: ./be/src/services/ai-search-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./be/src/services/ai-search-service/.env
    environment:
      NODE_OPTIONS: "--no-deprecation --max-old-space-size=2048"
      DB_HOST: postgres-job
      DB_PORT: 5432
      DB_DATABASE: jobdb
      EMBEDDING_PROVIDER: local
      REDIS_URL: redis://redis:6379
      CACHE_PREFIX: webthuctap
    depends_on:
      postgres-job:
        condition: service_healthy
    volumes:
      - huggingface-model-cache:/root/.cache/huggingface
    networks:
      - be

  # --- AI SERVICES ---
  forecast-service:
    build:
      context: ./ai-services/forecast-service
      dockerfile: Dockerfile
    restart: always
    networks:
      - be

  llm-service:
    build:
      context: ./ai-services/llm-service
      dockerfile: Dockerfile
    restart: always
    environment:
      - GEMMA_API_KEY=${GEMMA_API_KEY}
      - LLAMA_SERVER_URL=http://llama-server:8001
      - LLAMA_SERVER_MODEL=gemma-3-4b-it-q4_k_m
      - MAX_INPUT_CHARS=12000
      - MAX_OUTPUT_TOKENS=1536
      - QUEUE_CONCURRENCY=1
    depends_on:
      - llama-server
    networks:
      - be

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    expose: ["8001"]
    restart: always
    command:
      - -hf
      - ggml-org/gemma-3-4b-it-GGUF:Q4_K_M
      - --alias
      - gemma-3-4b-it-q4_k_m
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --threads
      - "6"
      - --jinja
      - --no-webui
    volumes:
      - llama-model-cache:/root/.cache/llama.cpp
    networks:
      - be

  ocr-service:
    build:
      context: ./ai-services/ocr-service
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - UPLOADS_DIR=/uploads
    volumes:
      - uploads:/uploads
    restart: always
    depends_on:
      - rabbitmq
    networks:
      - be

  # --- DATABASES & BROKERS ---
  postgres-auth:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Phuoc123456}
      POSTGRES_DB: authdb
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - be
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-job:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Phuoc123456}
      POSTGRES_DB: jobdb
    volumes:
      - pgdata-job:/var/lib/postgresql/data
    networks:
      - be
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-cv:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Phuoc123456}
      POSTGRES_DB: cvdb
    volumes:
      - pgdata-cv:/var/lib/postgresql/data
    networks:
      - be
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - be

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    networks:
      - be

networks:
  be:
    driver: bridge

volumes:
  pgdata-auth:
  pgdata-job:
  pgdata-cv:
  uploads:
  huggingface-model-cache:
  llama-model-cache:
